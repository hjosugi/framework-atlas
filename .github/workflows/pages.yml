name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate exact checked-out content
        run: make check
      - name: Ensure generators are drift-free
        run: git diff --exit-code
      - name: Record exact Pages source commit
        run: python3 scripts/write_source.py --commit "$GITHUB_SHA" --version "$(cat VERSION)"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
